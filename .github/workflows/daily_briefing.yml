name: Daily AI Briefing Bot (Telegram — 8:00 AM)

on:
  schedule:
    # Runs daily at 02:30 UTC (8:00 AM Indian Standard Time / UTC+5:30)
    - cron: '30 2 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  run-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily AI Briefing Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Telegram credentials (required)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Personalisation
          USER_CITY: ${{ vars.USER_CITY || 'New York' }}
          USER_NAME: ${{ vars.USER_NAME || 'Friend' }}
          FOCUS_TOPICS: ${{ vars.FOCUS_TOPICS || 'AI & Machine Learning, Tech Startups, Business' }}
        run: |
          python main.py
